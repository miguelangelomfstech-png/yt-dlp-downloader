# ===================================================================
# YT-DLP Downloader — Application Configuration
# ===================================================================

# Dynamic port: uses PORT env var (required by Render/Heroku), falls back to 9090
server.port=${PORT:9090}

# Name shown in the welcome banner on the frontend
app.welcome-message=Welcome to the YouTube Video Downloader

# Path to the yt-dlp executable.
# Use full path on Windows if yt-dlp is not on the JVM's PATH.
# On Docker / Linux deployments, "yt-dlp" should work if installed globally.
app.ytdlp.executable=C:\\Users\\migue\\AppData\\Local\\Programs\\Python\\Python313\\Scripts\\yt-dlp.EXE

# Logging
logging.level.com.ytdownloader=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Allow large file responses (up to 2 GB)
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
